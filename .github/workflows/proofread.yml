name: Proofreader

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the proofreader itself
        run: python3 -m unittest scripts/test_proofread.py
      - name: Run the proofreader
        run: python3 scripts/proofread.py
